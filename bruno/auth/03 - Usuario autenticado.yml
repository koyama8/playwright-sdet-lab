info:
  name: Consultar usuário autenticado
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/auth/me"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("deve retornar o usuário do token", () => {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().data.email).to.equal("qa@adminlab.com");
          expect(res.getBody().data.role).to.equal("ADMIN");
        });

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5
