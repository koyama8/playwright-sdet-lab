info:
  name: Rejeitar ID de pessoa inválido
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/api/people/id-invalido"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("deve validar UUID do path param", () => {
          expect(res.getStatus()).to.equal(400);
          expect(res.getBody().error.code).to.equal("VALIDATION_ERROR");
        });

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5
