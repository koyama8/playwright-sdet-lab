info:
  name: Filtrar pessoas ativas
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/people?status=ACTIVE&q=Playwright&page=1&pageSize=10"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("deve aceitar filtros e paginação", () => {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().data.items).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5
