info:
  name: Atualizar pessoa criada
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/api/people/{{personId}}"
  body:
    type: json
    data: |-
      {
        "name": "Pessoa Playwright Atualizada",
        "role": "SDET"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("deve atualizar a pessoa", () => {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().data.name).to.equal("Pessoa Playwright Atualizada");
          expect(res.getBody().data.role).to.equal("SDET");
        });

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5
