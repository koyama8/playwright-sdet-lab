info:
  name: Restaurar massas de demonstração
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/test-support/reset"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("deve restaurar as massas conhecidas", () => {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().data.people).to.equal(5);
          expect(res.getBody().data.movies).to.equal(8);
        });

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5

