services:
  db:
    image: postgres:16-alpine
    container_name: playwright-lab-db
    environment:
      POSTGRES_DB: playwright_lab
      POSTGRES_USER: qa_user
      POSTGRES_PASSWORD: qa_password
    ports:
      - "5435:5432"
    volumes:
      - playwright-lab-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_user -d playwright_lab"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      default:
        aliases:
          - postgres.playwright.test
    restart: unless-stopped

  dbadmin:
    image: dpage/pgadmin4:latest
    container_name: playwright-lab-dbadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "15435:80"
    volumes:
      - playwright-lab-pgadmin:/var/lib/pgadmin
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  playwright-lab-postgres:
  playwright-lab-pgadmin:
