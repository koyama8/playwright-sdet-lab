<div class="app-shell">
  <aside class="sidebar">
    <img class="sidebar-robot" src="/playwright-robot.png" alt="" aria-hidden="true" />
    <nav aria-label="Menu principal">
      <a routerLink="/dashboard" routerLinkActive="active" data-testid="nav-dashboard">
        <i class="nav-icon"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M3 10.8 12 3l9 7.8v9.7a.5.5 0 0 1-.5.5H15v-6H9v6H3.5a.5.5 0 0 1-.5-.5v-9.7Z"
            /></svg
        ></i>
        <span>Visão geral</span>
      </a>
      <a routerLink="/pessoas" routerLinkActive="active" data-testid="nav-people">
        <i class="nav-icon"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-7 8a7 7 0 0 1 14 0v1H5v-1Z" /></svg
        ></i>
        <span>Pessoas</span>
      </a>
      <a routerLink="/filmes" routerLinkActive="active" data-testid="nav-movies">
        <i class="nav-icon"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m4 5 3.2-2 2 3L12.4 4l2 3L17.6 5l2 3 .4-.3V21H4V5Zm2 6v8h12v-8H6Z" /></svg
        ></i>
        <span>Filmes</span>
      </a>
    </nav>
    <div class="environment">
      <i class="environment-icon"
        ><svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M5 3h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm0 10h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2Zm2-7v2h2V6H7Zm0 10v2h2v-2H7Z"
          /></svg
      ></i>
      <span>Ambiente</span><strong>Local</strong><small><i></i>Online</small>
    </div>
    <button class="reset-button" type="button" (click)="reset()" data-testid="reset-demo-data">
      <i>↻</i><span>Restaurar dados</span>
    </button>
  </aside>
  <section class="content-area">
    <header class="topbar">
      <label class="search-box">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m21 21-4.35-4.35m2.35-5.15A7.5 7.5 0 1 1 4 11.5a7.5 7.5 0 0 1 15 0Z" />
        </svg>
        <input
          #queryInput
          type="search"
          placeholder="Buscar pessoas e filmes..."
          aria-label="Busca global"
          data-testid="global-search"
          (keydown.enter)="search(queryInput.value)"
        />
      </label>
      <div class="top-actions">
        <button
          class="profile"
          type="button"
          (click)="profileOpen.set(!profileOpen())"
          [attr.aria-expanded]="profileOpen()"
          aria-label="Abrir menu do perfil"
          data-testid="profile-menu-toggle"
        >
          <span class="avatar">QA</span
          ><span
            ><strong>{{ userName() }}</strong
            ><small>{{ userRole() }}</small></span
          ><i>⌄</i>
        </button>
        @if (profileOpen()) {
          <div class="profile-menu" role="menu" data-testid="profile-menu">
            <button type="button" (click)="logout()" data-testid="logout">Sair da conta</button>
          </div>
        }
      </div>
    </header>
    <router-outlet />
  </section>
  @if (toast()) {
    <div class="toast" role="status" data-testid="toast">{{ toast() }}</div>
  }
</div>
